<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="anneau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ce00ff"/>
      <stop offset="0.45" stop-color="#0358ff"/>
      <stop offset="1" stop-color="#ce00ff"/>
    </linearGradient>
    <radialGradient id="fond" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#3a1f9e"/>
      <stop offset="0.6" stop-color="#150a45"/>
      <stop offset="1" stop-color="#07031c"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="0.45" stop-color="#ffd23d"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="carteA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#4a00ff"/>
    </linearGradient>
    <linearGradient id="carteB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb0ff"/>
      <stop offset="1" stop-color="#0358ff"/>
    </linearGradient>
    <linearGradient id="carteC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ef0"/>
      <stop offset="1" stop-color="#ce00ff"/>
    </linearGradient>
    <linearGradient id="ruban" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a00ff"/>
      <stop offset="1" stop-color="#ce00ff"/>
    </linearGradient>
  </defs>

  <!-- badge : anneau neon bleu / magenta, fond nuit -->
  <circle cx="64" cy="64" r="61" fill="url(#anneau)"/>
  <circle cx="64" cy="64" r="55" fill="url(#fond)"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- les inserts : trois cartes en eventail -->
  <g stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <rect x="30" y="26" width="34" height="48" rx="5" fill="url(#carteA)" transform="rotate(-20 47 50)"/>
    <rect x="47" y="21" width="34" height="48" rx="5" fill="url(#carteB)"/>
    <rect x="64" y="26" width="34" height="48" rx="5" fill="url(#carteC)" transform="rotate(20 81 50)"/>
  </g>
  <!-- reflets sur les cartes -->
  <g fill="#ffffff" fill-opacity="0.35">
    <rect x="34" y="30" width="8" height="30" rx="3" transform="rotate(-20 47 50)"/>
    <rect x="51" y="25" width="8" height="30" rx="3"/>
    <rect x="68" y="30" width="8" height="30" rx="3" transform="rotate(20 81 50)"/>
  </g>

  <!-- la celebrity : l'etoile doree devant -->
  <path d="M64 47l9.4 19.1 21.1 3.1-15.3 14.9 3.6 21-18.8-9.9-18.8 9.9 3.6-21-15.3-14.9 21.1-3.1z"
        fill="url(#or)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M64 56l5.2 10.6" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>

  <!-- ruban -->
  <path d="M14 96h100l-7 9 7 9H14l7-9z" fill="url(#ruban)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="64" y="110.5" text-anchor="middle" fill="#ffffff"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
        font-size="13" letter-spacing="0.5">CELEB+INS</text>
</svg>
